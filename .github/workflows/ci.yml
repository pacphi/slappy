name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check application and CLI
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  build-web:
    name: Build Nuxt Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      - name: Build Nuxt
        run: pnpm build

      - name: Install Chrome for browser checks
        run: pnpm exec puppeteer browsers install chrome

      - name: Verify production API and upload/picker workflows
        run: pnpm test:web

      - name: Verify compiled production styles
        run: pnpm test:build

      - name: Upload Nuxt build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nuxt-build
          path: |
            .output/
          retention-days: 7
          if-no-files-found: warn

  test-cli:
    name: Test CLI Tool with Sample CSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64

      # pnpm's restored package cache does not include Puppeteer's browser cache.
      - name: Install Chrome for Puppeteer tests
        run: pnpm exec puppeteer browsers install chrome

      - name: Test and enforce coverage
        run: pnpm test:coverage

      - name: Record function complexity
        run: pnpm quality:metrics

      - name: Upload coverage and complexity
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-evidence
          path: coverage/
          retention-days: 7

      - name: Test CLI with sample/sample-roster.csv
        run: pnpm test:local

      - name: Verify HTML output generated
        run: |
          if [ ! -f "sample/sample-roster-tags.html" ]; then
            echo "❌ Error: Output HTML file not generated"
            exit 1
          fi
          echo "✅ HTML file generated successfully"

          # Check file size (should be > 1KB for valid HTML)
          size=$(stat -c%s "sample/sample-roster-tags.html" 2>/dev/null || stat -f%z "sample/sample-roster-tags.html")
          if [ "$size" -lt 1024 ]; then
            echo "❌ Error: Output file is too small ($size bytes)"
            exit 1
          fi
          echo "✅ Output file size: $size bytes"

          # Check for HTML content
          if ! grep -q "<!DOCTYPE html>" "sample/sample-roster-tags.html"; then
            echo "❌ Error: Output file does not contain valid HTML"
            exit 1
          fi
          echo "✅ Output file contains valid HTML structure"

      - name: Upload generated HTML as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-output-html
          path: sample/sample-roster-tags.html
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=low

  dead-code:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for unused exports
        run: pnpm deadcode

  deployment:
    name: Docker Deployment Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t slappy:ci .

      - name: Start production server
        run: docker run -d --name slappy-smoke slappy:ci

      - name: Verify Node 26, label formats, validation, and Chromium PDF generation
        run: docker exec -i slappy-smoke node --input-type=module < scripts/smoke-deployment.mjs

      - name: Show server logs
        if: always()
        run: docker logs slappy-smoke

      - name: Stop smoke container
        if: always()
        run: docker rm -f slappy-smoke
