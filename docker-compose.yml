services:
  # Nuxt Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service with hot reload
  dev:
    image: node:26-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    command: sh -c "npm install --global pnpm@12.3.4 && pnpm install && pnpm dev"
